{{- /* ClientTrafficPolicy is an Envoy Gateway CRD. Skip on other providers. */ -}}
{{- if and (eq (.Values.gateway.provider | default "envoy-gateway") "envoy-gateway") .Values.gateway.enabled .Values.trafficPolicy }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "lookout.fullname" . }}-upload-limit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
{{- end }}
