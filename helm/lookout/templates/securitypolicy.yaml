{{- /* SecurityPolicy is an Envoy Gateway CRD; for other providers, auth is
       expected to be provided externally (e.g., oauth2-proxy in Istio). */ -}}
{{- if and (eq (.Values.gateway.provider | default "envoy-gateway") "envoy-gateway") .Values.basicAuth.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "lookout.fullname" . }}-basic-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookout.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "lookout.name" . }}
  basicAuth:
    users:
      name: {{ include "lookout.fullname" . }}-basic-auth
{{- end }}
